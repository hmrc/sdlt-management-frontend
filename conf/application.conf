include "frontend.conf"

appName="sdlt-management-frontend"

play.http.router = prod.Routes

play.http.errorHandler = "handlers.ErrorHandler"

play.modules.enabled += "uk.gov.hmrc.play.bootstrap.AuthModule"
play.modules.enabled += "uk.gov.hmrc.mongo.play.PlayMongoModule"
play.modules.enabled += "uk.gov.hmrc.play.bootstrap.HttpClientV2Module"
play.modules.enabled += "config.Module"

play.filters.enabled += play.filters.csp.CSPFilter

play.i18n.langs = ["en"]

microservice {
    services {
      auth {
        protocol = http
        host     = localhost
        port     = 8500
      }

      stamp-duty-land-tax {
        protocol = http
        host     = localhost
        port     = 10913
      }

    }
}

stamp-duty-land-tax-filing {
  host = "http://localhost:10910"
}

stamp-duty-land-tax-agent {
  host = "http://localhost:10911"
}

contact-frontend {
  host      = "http://localhost:9250"
  serviceId = "sdlt-management-frontend"
}

feedback-frontend {
  host = "http://localhost:9514"
}

add-taxes-frontend {
    host = "http://localhost:9730"
}

business-tax-account {
    host = "http://localhost:9020"
}

timeout-dialog {
  timeout   = 900
  countdown = 120
}

session {
  timeoutSeconds = 900
}

mongodb {
  uri                 = "mongodb://localhost:27017/"${appName}
  timeToLiveInSeconds = 900
}

urls {
  login                 = ${loginHost}"/auth-login-stub/gg-sign-in"
  loginContinue         = "http://localhost:9000/sdlt-management-frontend"
  signOut               = "http://localhost:9553/bas-gateway/sign-out-without-state"
  govUK                 = "https://localhost:9280/account"
  govUkSDLTGuidance     = "https://www.gov.uk/stamp-duty-land-tax"
  howToPay              = "https://www.gov.uk/guidance/pay-stamp-duty-land-tax"
  hmrcOnlineServiceDesk = "https://www.gov.uk/find-hmrc-contacts/technical-support-with-hmrc-online-services"
  hmrcOnlineHelpDesk    = "https://www.gov.uk/find-hmrc-contacts/stamp-duty-land-tax-general-enquiries"
  contactHmrc           = "https://www.gov.uk/find-hmrc-contacts"
  sdltOnline            = "https://www.gov.uk/guidance/stamp-duty-land-tax-online-and-paper-returns"
  sublease              = "https://www.gov.uk/hmrc-internal-manuals/stamp-duty-land-tax-manual/sdltm62045"
  sdlt1                 = "https://www.gov.uk/government/publications/sdlt-guide-for-completing-paper-sdlt1-return"
  sdlt4                 = "https://www.gov.uk/government/publications/sdlt-guide-for-completing-form-sdlt4"
  sdltManual            = "https://www.gov.uk/hmrc-internal-manuals/stamp-duty-land-tax-manual"
  rates                 = "https://www.gov.uk/government/publications/rates-and-allowances-stamp-duty-land-tax"
  valuation             = "https://www.gov.uk/government/organisations/valuation-office-agency"
  thirdParty            = "https://www.gov.uk/government/publications/stamp-duty-commercial-software-suppliers"
}

loginHost = "http://localhost:9949"
host = "http://localhost:9000"

accessibility-statement{
  service-path = "/sdlt-management-frontend"
}

tracking-consent-frontend {
  gtm.container = "transitional"
}

play-frontend-hmrc {
    useRebrand = true
}

play-frontend-hmrc.forceServiceNavigation = true
